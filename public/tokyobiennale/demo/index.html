// ---------------------------------------------------------------- sound
// The recordings are placeholders: the Study 09 tapes, cleaned (clicks trimmed, hiss removed,

      const b = await ctx.decodeAudioData(await (await fetch(`voice-${v}.wav`)).arrayBuffer());

      const out = ctx.createBuffer(1, b.length + ctx.sampleRate * 2, b.sampleRate); out.copyToChannel(b.getChannelData(0), 0); buffers[v] = out;

  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    for (const [lo, hi, u0, u1, v0, v1] of ax) for (const side of [lo, hi]) {
      if (Math.abs(a[side] - b[side]) > 1e-6) continue;
      const ou = Math.min(a[u1], b[u1]) - Math.max(a[u0], b[u0]), ov = Math.min(a[v1], b[v1]) - Math.max(a[v0], b[v0]);
      if (ou <= 1e-4 || ov <= 1e-4) continue;
      if (side === 'z0' && hiddenDown(a, a.z0) && hiddenDown(b, b.z0)) continue;   // both bottoms sit on a floor: never seen
      fights.push(`${a.kind}[${a.x0},${a.y0},${a.z0}] / ${b.kind}[${b.x0},${b.y0},${b.z0}] on ${side}=${a[side]}`);
    }
  }
  check('no coplanar overlapping faces (z-fighting)', fights.length === 0, { count: fights.length, first: fights.slice(0, 6) });
  // lighting comes from the ceiling panels: every light is a panel, and there are no other lamps
  const lamps = []; scene.traverse(o => { if (o.isPointLight || o.isDirectionalLight || o.isRectAreaLight) lamps.push(o.type); });
  check('visible hall floor is not blown out (95% of it below 1.0 before tone mapping)', lightStats.hallFloor.p95 < 1.0, lightStats.hallFloor);
  check('the station is lit only by its ceiling panels', LIGHTS.length === boxes.filter(b => b.kind === 'glow' || b.kind === 'day').length && (lamps.length === 0 || LIGHT === 'shadowmap'), { mode: LIGHT, panels: LIGHTS.length, otherLamps: lamps.length, ...lightStats, hallFloor: undefined });
  // both ways down to the platform go through ticket gates
  function reachPlatform(extra) {
    const seen = new Set(), q = [[SPAWN.x, SPAWN.y, SPAWN.z]], S = 0.25;
    while (q.length) {
      const [x, y, z] = q.pop();
      if (z < -3.9 && x > 21 && x < 32 && y > 14 && y < 44) return true;
      for (const [dx, dy] of [[S, 0], [-S, 0], [0, S], [0, -S]]) {
        const nx = +(x + dx).toFixed(2), ny = +(y + dy).toFixed(2);
        if (blocked(nx, ny, z, extra)) continue;
        const nz = groundAt(nx, ny, z), key = `${nx},${ny},${Math.round(nz * 5)}`;
        if (seen.has(key)) continue; seen.add(key); q.push([nx, ny, nz]);
      }
    }
    return false;
  }
  const gateLines = [{ x0: 19.7, y0: 0, z0: 0, x1: 20.3, y1: 22, z1: 1.0 }, { x0: -10, y0: GATE_A_Y, z0: 0, x1: -5, y1: GATE_A_Y + 0.6, z1: 1.0 }];
  const open = reachPlatform(), closed = reachPlatform(gateLines);
  check('both routes to the platform pass through ticket gates', open && !closed, { reachableThroughGates: open, reachableWithGatesShut: closed });
  const dt = 1 / 30;
  function walkTo(tx, ty, limit = 90) {
    for (let t = 0; t < limit; t += dt) {
      if (Math.hypot(tx - P.x, ty - P.y) < 0.2) { for (let k = 0; k < 20; k++) move(0, 0, dt); return true; }
      P.yaw = Math.atan2(ty - P.y, tx - P.x);
      const fx = Math.cos(P.yaw), fy = Math.sin(P.yaw);
      move(fx * 1.4 * dt, fy * 1.4 * dt, dt); encounters();
    }
    return false;
  }
  const route = [
    ['down the exit stair into the hall', 4, 1.5, 0], ['hall, middle', 12.9, 9.4, 0], ['hall, west side', 2, 10.5, 0], ['passage A, west end', -7.5, 10.5, 0],
    ['passage A, through its gates', -7.5 + 0.65, 28, 0], ['stair down to B2', -7.5, 36.4, -4], ['B2 corridor, west', -7.5, 38, -4],
    ['B2 corridor, east', 19, 38, -4], ['platform, north', 24, 42, -4], ['platform, south', 24, 15, -4],
    ['stair up to the hall', 24, 7.6, 0], ['through the hall gates', 20, 6.5, 0], ['hall, north', 14.5, 20, 0],
    ['passage B, shutter', 14.5, 31, 0], ['back to the hall', 4, 2, 0], ['exit stair, top', 4, -4.05, 2.04],
  ];
  for (const [name, x, y, ez] of route) {
    const ok = walkTo(x, y); const zok = Math.abs(P.z - ez) < 0.2;
    out.route.push({ name, reached: ok, z: +P.z.toFixed(2), expectedZ: ez, pass: ok && zok, at: [+P.x.toFixed(2), +P.y.toFixed(2)] });
    if (!(ok && zok)) out.fail++;
  }
  for (const o of OBJECTS) {
    const [ax2, ay2] = o.approach; P.x = ax2; P.y = ay2; P.z = groundAt(ax2, ay2, o.at[2] + 1);
    stopVoice(); for (let i = 0; i < 5; i++) encounters();
    const heard = state.active === o.id && sub.classList.contains('on') && document.getElementById('lname').textContent === o.name;
    const ux = (ax2 - o.at[0]) / Math.hypot(ax2 - o.at[0], ay2 - o.at[1]), uy = (ay2 - o.at[1]) / Math.hypot(ax2 - o.at[0], ay2 - o.at[1]);
    const levels = [];
    for (let k = 1; k <= 16 && state.active === o.id; k++) { P.x = ax2 + ux * 0.25 * k; P.y = ay2 + uy * 0.25 * k; encounters(); levels.push(+(state.level ?? 0).toFixed(2)); }
    const falling = levels.every((v, i) => i === 0 || v <= levels[i - 1] + 1e-9);
    const faded = state.active !== o.id;
    out.objects.push({ id: o.id, heard, thinsOut: falling, fadedWhenLeft: faded, pass: heard && falling && faded });
    if (!(heard && falling && faded)) out.fail++;
  }
  Object.assign(P, SPAWN); place(); renderer.render(scene, cam);
  out.info = { boxes: boxes.length, floors: floors.length, solids: solids.length, drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles, bakeMs: lightStats.ms, light: LIGHT };
  out.pass = out.fail === 0;
  const pre = document.getElementById('result'); pre.textContent = JSON.stringify(out, null, 1); pre.style.display = 'block';
  document.title = (out.pass ? 'PASS' : 'FAIL') + ' ' + out.fail;
}
