name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The creative-coding sketches live in their own repo and publish
      # themselves at divyatak.github.io/creative-visuals. They are pulled in
      # at build time so they also answer at divyatak.art/creativevisuals,
      # rather than keeping a second copy of them in this repository that
      # would quietly fall behind. Checked out before the build, so nothing
      # can disturb dist/ afterwards.
      - name: Fetch the creative-visuals sketches
        uses: actions/checkout@v4
        with:
          repository: divyatak/creative-visuals
          ref: main
          path: .creative-visuals

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Mount the sketches at /creativevisuals
        run: |
          rm -rf .creative-visuals/.git .creative-visuals/.github
          mkdir -p dist/creativevisuals
          cp -a .creative-visuals/. dist/creativevisuals/
          echo "mounted:" && ls dist/creativevisuals

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
